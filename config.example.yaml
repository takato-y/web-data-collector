# 収集ツールの設定例（デモショップ用）
# 使うときは config.yaml という名前で写して編集する（config.yaml は Git の管理外）。
# パスはこのファイルのあるフォルダからの相対で解決する。

# 名乗り（User-Agent）。ツール名と、対象サイトの管理者が問い合わせできるページの URL を入れる
user_agent: "WebDataCollector/1.0 (+https://example.com/bot-info)"

request:
  interval_sec: 1.0        # 同じサイトへの取得の間隔（秒）。下限 0.5。Crawl-delay が長ければそちらに従う
  timeout_sec: 10          # 応答待ちの上限（秒）
  max_retries: 3           # 再試行の回数
  backoff_base_sec: 1.0    # 再試行の待ち時間の基準（1 回目 1 秒、2 回目 2 秒、3 回目 4 秒）
  max_retry_after_sec: 60  # 相手が指定した待ち時間（Retry-After）の上限
  max_pages: 50            # 1 対象あたりの取得ページ数の上限

storage:
  db_path: data/history.db
report:
  output_dir: output
log:
  dir: logs

notify:
  enabled: true
  format: slack             # slack / discord / teams / generic
  webhook_url_env: WEBHOOK_URL  # URL はこの環境変数で渡す（このファイルには書かない）
  max_items: 20             # 通知本文に載せる変更の件数の上限（残りは件数のみ）

targets:
  - name: demo_shop
    type: static
    start_url: http://127.0.0.1:8000/products
    item_selector: li.product-card
    next_page: a.next
    fields:
      product_id: { attr: data-product-id }
      name: { selector: .name }
      price: { selector: .price, type: price }
      url: { selector: a.product-link, attr: href, type: url }
    detail_fields:
      stock: { selector: .stock, type: stock }
      category: { selector: .category }

  - name: demo_shop_new
    type: js                 # JavaScript で描画されるページ（Playwright が必要。無ければ見送り）
    start_url: http://127.0.0.1:8000/new-arrivals
    wait_for: li.product-card
    item_selector: li.product-card
    fields:
      product_id: { attr: data-product-id }
      name: { selector: .name }
      price: { selector: .price, type: price }
      stock: { selector: .stock, type: stock }
