name: test

on:
  push:
    branches: [main]
  pull_request:

# テストはリポジトリを読むだけなので、トークンの権限を読み取りに限定する
permissions:
  contents: read

# 実際のサイトへの収集は行わない。ブラウザ（Playwright）を使うテストは、ブラウザが無いと自動で飛ばす。
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - run: npm test
